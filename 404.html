<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>페이지를 찾을 수 없습니다 — 배우 박지오</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2308080a'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='Georgia,serif' fill='%23c9ae82'>J</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+KR:wght@200;300&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#08080a; --paper:#ede9e2; --paper-dim:#a9a49b; --paper-faint:#8f8a80;
  --gold:#c9ae82; --line:rgba(237,233,226,.12);
  --serif:'Cormorant Garamond',Georgia,serif;
  --kserif:'Noto Serif KR','Cormorant Garamond',serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100svh; background:var(--ink); color:var(--paper);
  font-family:var(--sans); font-weight:300; word-break:keep-all;
  display:grid; place-items:center; text-align:center;
  padding:clamp(24px,6vw,64px);
  padding-bottom:calc(clamp(24px,6vw,64px) + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px}
.code{
  font-family:var(--serif); font-weight:300; line-height:1;
  font-size:clamp(5.5rem,22vw,11rem); color:var(--gold); letter-spacing:.04em;
}
h1{
  font-family:var(--kserif); font-weight:200; letter-spacing:-.02em;
  font-size:clamp(1.3rem,4.6vw,2rem); margin-top:clamp(14px,2.5vw,22px);
}
p{
  color:var(--paper-dim); font-size:clamp(.9rem,2.4vw,1rem); line-height:1.9;
  margin-top:clamp(12px,2vw,18px);
}
.rule{width:56px;height:1px;background:var(--line);margin:clamp(26px,4vw,38px) auto}
.btn{
  display:inline-flex; align-items:center; gap:.7em; min-height:44px;
  border:1px solid var(--gold); border-radius:999px; color:var(--gold);
  padding:.8rem 1.7rem; font-size:.84rem; letter-spacing:.14em;
  transition:background .4s ease,color .4s ease;
}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink)}
.sig{
  margin-top:clamp(30px,5vw,46px); font-family:var(--serif);
  font-size:.82rem; letter-spacing:.32em; text-transform:uppercase; color:var(--paper-faint);
}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나, 삭제된 페이지일 수 있습니다.<br>프로필은 아래에서 이어서 보실 수 있습니다.</p>
    <div class="rule"></div>
    <a class="btn" href="/">프로필로 돌아가기</a>
    <div class="sig">Ji-oh Park</div>
  </main>
</body>
</html>
